<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal C.R.I - Arago Sécurité</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #2c3e50; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .device { 
            width: 100%; 
            max-width: 420px; 
            height: 100vh;
            max-height: 850px;
            background: #ecf0f1; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        @media (min-width: 450px) {
            .device { height: 850px; border-radius: 30px; border: 12px solid #1a252f; }
        }
        .header { 
            background: #004b87; 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 18px; 
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header .status { font-size: 12px; color: #f1c40f; }
        .screen { 
            padding: 20px; 
            overflow-y: auto; 
            flex: 1; 
        }
        .section-title { 
            font-size: 12px; 
            color: #7f8c8d; 
            text-transform: uppercase; 
            font-weight: bold; 
            margin: 15px 0 5px 0; 
            border-bottom: 2px solid #bdc3c7; 
            padding-bottom: 3px; 
        }
        .form-group { margin-bottom: 12px; }
        label { 
            display: block; 
            font-size: 12px; 
            font-weight: bold; 
            margin-bottom: 4px; 
            color: #34495e; 
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 15px; 
            box-sizing: border-box; 
            background: white;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 100px; }
        input:focus, select:focus, textarea:focus { 
            border-color: #004b87; 
            outline: none; 
            box-shadow: 0 0 5px rgba(0,75,135,0.3);
        }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 5px;
        }
        .checkbox-group label {
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-group input[type="checkbox"] { width: auto; margin: 0; transform: scale(1.2); }

        /* Style pour le bouton photo */
        .btn-photo {
            display: inline-block;
            background: #34495e;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 5px;
        }
        .btn-photo:active { background: #2c3e50; }

        .btn { 
            background: #27ae60; 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 16px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 20px; 
            box-shadow: 0 4px 6px rgba(39, 174, 96, 0.3);
            transition: 0.2s;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(39, 174, 96, 0.3); }

        .modal { 
            display: none; 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            padding: 20px; 
            box-sizing: border-box; 
            border-radius: inherit;
        }
        .receipt { 
            background: #fff; 
            padding: 20px; 
            width: 100%; 
            max-width: 340px; 
            box-sizing: border-box; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 13px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
            max-height: 80vh;
            overflow-y: auto;
        }
        .receipt-header { 
            text-align: center; 
            border-bottom: 2px solid #333; 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
        }
        .receipt-body div { margin-bottom: 6px; }
        .btn-close { background: #e74c3c; margin-top: 15px; width: 80%; }
    </style>
</head>
<body>

<div class="device">
    <div class="header">
        <span>MAIN COURANTE ÉLECTRONIQUE</span>
        <span class="status">● SAISIE C.R.I</span>
    </div>
    
    <div class="screen">
        <form id="cri-form">
            <div class="section-title">Agent Rédacteur</div>
            <div class="row">
                <div class="form-group">
                    <label>Nom de l'agent</label>
                    <input type="text" id="nomAgent" placeholder="Ex: DUPONT" style="text-transform: uppercase;" required>
                </div>
                <div class="form-group">
                    <label>Poste / Indicatif</label>
                    <input type="text" id="poste" placeholder="Ex: Accueil, Alpha..." required>
                </div>
            </div>

            <div class="section-title">L'Événement (Quand & Où)</div>
            <div class="row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Heure</label>
                    <input type="time" id="time" required>
                </div>
            </div>
            <div class="form-group">
                <label>Lieu exact de l'incident</label>
                <input type="text" id="lieu" placeholder="Ex: Parking Nord, Porte C3..." required>
            </div>

            <div class="section-title">Nature des faits (Quoi)</div>
            <div class="form-group">
                <select id="nature" required>
                    <option value="" disabled selected>-- Sélectionner la nature --</option>
                    <option value="Secours à Personne (Malaise, Blessure)">Secours à Personne (Malaise, Blessure)</option>
                    <option value="Vol / Tentative de vol (Flagrance)">Vol / Tentative de vol (Flagrance)</option>
                    <option value="Dégradation / Vandalisme">Dégradation / Vandalisme</option>
                    <option value="Intrusion / Effraction">Intrusion / Effraction</option>
                    <option value="Agression / Altercation physique">Agression / Altercation physique</option>
                    <option value="Outrage / Insultes">Outrage / Insultes envers l'agent</option>
                    <option value="Départ de Feu / Alarme Incendie">Départ de Feu / Alarme Incendie</option>
                    <option value="Autre incident technique">Autre incident technique</option>
                </select>
            </div>

            <div class="section-title">Description (Comment & Pourquoi)</div>
            <div class="form-group">
                <label>Relation détaillée des faits (Soyez factuel)</label>
                <textarea id="description" placeholder="À mon arrivée sur les lieux, j'ai constaté que..." required></textarea>
            </div>

            <div class="section-title">Pièce Jointe</div>
            <div class="form-group">
                <label for="photo" class="btn-photo">📷 Prendre / Ajouter une photo</label>
                <!-- capture="environment" ouvre directement l'appareil photo sur mobile -->
                <input type="file" id="photo" accept="image/*" capture="environment" style="display:none;" onchange="updatePhotoStatus()">
                <div id="photo-status" style="font-size: 12px; color: #27ae60; font-weight: bold; text-align: center;"></div>
            </div>

            <div class="section-title">Mesures prises</div>
            <div class="form-group">
                <div class="checkbox-group">
                    <label><input type="checkbox" value="Secours prévenus (15/18/112)"> Secours prévenus (15/18)</label>
                    <label><input type="checkbox" value="Forces de l'Ordre (FDO) prévenues (17)"> Forces de l'Ordre (FDO)</label>
                    <label><input type="checkbox" value="Individu appréhendé (Art 73 CPP)"> Individu appréhendé</label>
                    <label><input type="checkbox" value="Palpation de sécurité effectuée"> Palpation de sécurité</label>
                    <label><input type="checkbox" value="Moyen d'entrave utilisé (Art 803 CPP)"> Moyen d'entrave</label>
                    <label><input type="checkbox" value="Gel des lieux effectué"> Gel des lieux</label>
                </div>
            </div>

            <button type="button" class="btn" onclick="genererCRI()">Transmettre le C.R.I</button>
        </form>
    </div>

    <!-- Modal Récapitulatif -->
    <div class="modal" id="ticket-modal">
        <div class="receipt">
            <div class="receipt-header">
                <h3 style="margin: 0;">COMPTE RENDU D'INCIDENT</h3>
                <span>LYCÉE FRANÇOIS ARAGO</span>
            </div>
            <div class="receipt-body">
                <div><strong>AGENT :</strong> <span id="out-agent"></span> (<span id="out-poste"></span>)</div>
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">
                <div><strong>DATE :</strong> <span id="out-date"></span> à <span id="out-time"></span></div>
                <div><strong>LIEU :</strong> <span id="out-lieu"></span></div>
                <div><strong>NATURE :</strong> <span id="out-nature"></span></div>
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">
                <div><strong>DESCRIPTION :</strong><br><span id="out-desc" style="white-space: pre-wrap;"></span></div>
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">
                <div><strong>MESURES PRISES :</strong><br><span id="out-mesures"></span></div>
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">
                <div id="out-photo-status" style="font-weight: bold; color: #c0392b; text-align: center;"></div>
            </div>
        </div>
        <button class="btn btn-close" onclick="fermerCRI()">Fermer</button>
    </div>
</div>

<script>
    window.onload = function() {
        const now = new Date();
        document.getElementById('date').value = now.toISOString().split('T')[0];
        document.getElementById('time').value = now.toTimeString().substring(0, 5);
    };

    function updatePhotoStatus() {
        const file = document.getElementById('photo').files[0];
        if(file) {
            document.getElementById('photo-status').innerText = "✓ Photo enregistrée : " + file.name;
        }
    }

    function genererCRI() {
        const nomAgent = document.getElementById('nomAgent').value.toUpperCase();
        const poste = document.getElementById('poste').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;
        const lieu = document.getElementById('lieu').value;
        const nature = document.getElementById('nature').value;
        const description = document.getElementById('description').value;

        if(!nomAgent || !lieu || !nature || !description) {
            alert("Veuillez remplir tous les champs obligatoires (Agent, Lieu, Nature, Description).");
            return;
        }

        // Récupération des cases cochées
        let mesures = [];
        const checkboxes = document.querySelectorAll('.checkbox-group input[type="checkbox"]:checked');
        checkboxes.forEach((cb) => {
            mesures.push("- " + cb.value);
        });
        const mesuresText = mesures.length > 0 ? mesures.join('\n') : "Aucune mesure supplémentaire.";

        // Vérification de la photo
        const photoInput = document.getElementById('photo');
        let emailPhotoMention = "Aucune photo jointe.";
        let uiPhotoMention = "Pas de photo jointe.";
        
        if (photoInput.files && photoInput.files.length > 0) {
            uiPhotoMention = "📷 Photo prise. N'oubliez pas de l'ajouter dans l'e-mail !";
            emailPhotoMention = "⚠️ INFO FORMATEUR : L'élève a pris une photo. Elle doit être ajoutée MANUELLEMENT en pièce jointe à cet e-mail.";
        }

        // Affichage écran
        document.getElementById('out-agent').innerText = nomAgent;
        document.getElementById('out-poste').innerText = poste;
        document.getElementById('out-date').innerText = date;
        document.getElementById('out-time').innerText = time;
        document.getElementById('out-lieu').innerText = lieu;
        document.getElementById('out-nature').innerText = nature;
        document.getElementById('out-desc').innerText = description;
        document.getElementById('out-mesures').innerText = mesuresText;
        document.getElementById('out-photo-status').innerText = uiPhotoMention;

        document.getElementById('ticket-modal').style.display = 'flex';

        // Envoi Email
        const emailTo = "benoit.dol@monlycee.net";
        const emailSubject = encodeURIComponent(`C.R.I - ${nature} - Agent ${nomAgent}`);
        const emailBody = encodeURIComponent(`
COMPTE RENDU D'INCIDENT - LYCÉE FRANÇOIS ARAGO

[ AGENT RÉDACTEUR ]
Nom : ${nomAgent}
Poste / Indicatif : ${poste}

[ FAITS ]
Date et Heure : Le ${date} à ${time}
Lieu : ${lieu}
Nature de l'incident : ${nature}

[ DESCRIPTION DÉTAILLÉE ]
${description}

[ MESURES CONSERVATOIRES ET SUITES ]
${mesuresText}

[ PIÈCE JOINTE ]
${emailPhotoMention}

--------------------------------------------------
Rapport généré électroniquement via le Terminal C.R.I.
        `);

        // Petite temporisation pour que l'élève voie le ticket avant l'ouverture de l'app mail
        setTimeout(() => {
            window.location.href = `mailto:${emailTo}?subject=${emailSubject}&body=${emailBody}`;
        }, 800);
    }

    function fermerCRI() {
        document.getElementById('ticket-modal').style.display = 'none';
        document.getElementById('description').value = '';
        document.getElementById('photo').value = '';
        document.getElementById('photo-status').innerText = '';
        const checkboxes = document.querySelectorAll('.checkbox-group input[type="checkbox"]');
        checkboxes.forEach((cb) => cb.checked = false);
    }
</script>

</body>
</html>
